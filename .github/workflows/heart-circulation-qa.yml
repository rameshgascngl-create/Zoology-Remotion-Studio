name: Heart circulation composition QA
on:
  pull_request:
    paths:
      - 'video-studio/**'
      - '.github/workflows/heart-circulation-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: video-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: video-studio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint and type-check
        run: npm run lint
